services:
  - type: web
    name: world-tree
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: MODERATOR_SECRET
        sync: false
      - key: DEV_PUBKEY
        value: Bo7ZRCgtfoi7ozLTG7wSjvdGjNeFiG6tMoBpukKuTTia
      - key: TREASURY_PUBKEY
        value: HGhjetz9MFSQBeCoSdPpuVqF7nhaJij7BGDyyigk7YRK
      - key: SOLANA_RPC
        value: https://api.devnet.solana.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: ADMIN_KEY # 星愿大使后台（x-admin-key）
        sync: false
      - key: EVM_DEV_ADDRESS # EVM 测试网收款：开发者 20%（与 EVM_TREASURY_ADDRESS 都设置后才显示 EVM 支付）
        sync: false
      - key: EVM_TREASURY_ADDRESS # EVM 测试网收款：项目金库 80%
        sync: false
      - key: RESEND_API_KEY # 邮箱验证码发送（可选，配合 MAIL_FROM）
        sync: false
      - key: MAIL_FROM
        sync: false
