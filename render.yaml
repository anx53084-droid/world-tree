services:
  - type: web
    name: world-tree
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: DYNAMIC_ENV_ID # Dynamic Environment ID（公开标识）：邮箱 / Google 登录 + 嵌入式 Solana 钱包；未配置时前端显示“尚未配置”
        sync: false
      - key: WC_PROJECT_ID # WalletConnect 项目 ID（公开标识）
        sync: false
      - key: MODERATOR_SECRET
        sync: false
      - key: RECEIVE_PUBKEY # 已弃用：收款地址见 receive-config.js；此变量只会被当作“历史收款地址”（仅校验旧记录）
        sync: false
      - key: DEV_PUBKEY # 兼容旧名；未设 RECEIVE_PUBKEY 时可用
        sync: false
      - key: TREASURY_PUBKEY # 兼容旧名；未设 RECEIVE_PUBKEY 时可用
        sync: false
      - key: SOLANA_RPC
        value: https://api.devnet.solana.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: D1_API_TOKEN
        sync: false
      - key: D1_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: ADMIN_KEY # 星愿大使后台（x-admin-key）
        sync: false
      - key: EVM_PAY_ETH # 已弃用：见 receive-config.js；只会被当作历史收款地址
        sync: false
      - key: EVM_PAY_BSC # 已弃用：见 receive-config.js；只会被当作历史收款地址
        sync: false
      - key: EVM_PAY_BASE # 已弃用：见 receive-config.js；只会被当作历史收款地址
        sync: false
      - key: EVM_PAY_ARB # 已弃用：见 receive-config.js；只会被当作历史收款地址
        sync: false
      - key: EVM_PAY_UNI # 已弃用：见 receive-config.js；只会被当作历史收款地址
        sync: false
      - key: RESEND_API_KEY # 邮箱验证码发送（可选，配合 MAIL_FROM）
        sync: false
      - key: MAIL_FROM
        sync: false
