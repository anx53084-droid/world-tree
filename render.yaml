services:
  - type: web
    name: world-tree
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: MODERATOR_SECRET
        sync: false
      - key: RECEIVE_PUBKEY # Solana 单一收款地址（全额）
        sync: false
      - key: DEV_PUBKEY # 兼容旧名；未设 RECEIVE_PUBKEY 时可用
        sync: false
      - key: TREASURY_PUBKEY # 兼容旧名；未设 RECEIVE_PUBKEY 时可用
        sync: false
      - key: SOLANA_RPC
        value: https://api.devnet.solana.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: D1_API_TOKEN
        sync: false
      - key: D1_ACCOUNT_ID
        sync: false
      - key: D1_DATABASE_ID
        sync: false
      - key: ADMIN_KEY # 星愿大使后台（x-admin-key）
        sync: false
      - key: EVM_PAY_ETH # Ethereum/Sepolia 单一收款
        sync: false
      - key: EVM_PAY_BSC # BNB/BSC 单一收款
        sync: false
      - key: EVM_PAY_BASE # Base 单一收款
        sync: false
      - key: EVM_PAY_ARB # Arbitrum 单一收款
        sync: false
      - key: EVM_PAY_UNI # UNI：Unichain 未实现时经以太坊路径，地址标 UNI
        sync: false
      - key: RESEND_API_KEY # 邮箱验证码发送（可选，配合 MAIL_FROM）
        sync: false
      - key: MAIL_FROM
        sync: false
