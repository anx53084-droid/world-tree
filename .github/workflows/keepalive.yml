# 保活（GitHub Actions）：每 10 分钟触发；每次运行在约 25 分钟内每 5 分钟请求一次 /api/health。
# GitHub 的 schedule 常延迟 5–30 分钟、高峰会跳过，所以每次运行覆盖后面 25 分钟，延迟/漏跑时也能接上；concurrency 保证同时只跑一个、最多排队一个。
# 公开仓库 Actions 分钟数免费。北京时间 02:00–06:59 不保活（给 Render 750h/月免费额度留余量）。
# Cloudflare Worker Cron（workers/keepalive）更准时，CLOUDFLARE_API_TOKEN 加上 Workers 权限后会自动接管为主方案，本任务继续作为备份。
name: Keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ping /api/health every 5 min (~25 min)
        # 备份方案永不标红：每次 ping 最多 3 次尝试（单次 90s 超时，覆盖 Render 冷启动），失败只记 ::warning::，脚本始终 exit 0。
        # （10-19 那次失败的原因：循环最后一行 `[ $i -lt 6 ] && sleep 290` 在 i=6 时返回 1，成了脚本退出码——6 次 ping 其实全部 200。）
        shell: bash
        run: |
          set +e
          URL=https://world-tree-ijv1.onrender.com/api/health
          T0=$(date +%s); ok=0; bad=0
          for i in 1 2 3 4 5 6; do
            WAIT=$(( T0 + (i - 1) * 290 - $(date +%s) )); if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
            H=$(( ( 10#$(date -u +%H) + 8 ) % 24 ))
            if [ "$H" -ge 2 ] && [ "$H" -lt 7 ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "$(date -u +%FT%TZ) quiet hours (Beijing $H:00) — skip"; break; fi
            done_i=0
            for try in 1 2 3; do
              rm -f /tmp/r.json /tmp/err.txt; code=$(curl -sS --connect-timeout 30 -m 90 -o /tmp/r.json -w '%{http_code} %{time_total}' -H 'x-keepalive: gh-actions' "$URL" 2>/tmp/err.txt)
              echo "$(date -u +%FT%TZ) ping $i try $try → ${code:-curl-error} $(head -c 200 /tmp/r.json 2>/dev/null) $(head -c 200 /tmp/err.txt)"
              case "$code" in 2*) done_i=1; break;; esac
              sleep 20
            done
            if [ "$done_i" = 1 ]; then ok=$((ok + 1)); else bad=$((bad + 1)); echo "::warning::keepalive ping $i failed after 3 tries (last: ${code:-curl-error})"; fi
          done
          echo "summary: ok=$ok failed=$bad"
          exit 0
