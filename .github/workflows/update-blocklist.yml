name: Update phishing / short-link blocklist
on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC（北京时间 11:17）
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: blocklist, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Merge sources
        run: node scripts/convert-blocklist.js
      - name: Commit only if changed
        run: |
          if git diff --quiet -- public/blocklist.json public/blocklist-core.json; then echo "no change"; exit 0; fi
          git config user.name "blocklist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blocklist.json public/blocklist-core.json
          git commit -m "chore(blocklist): daily update $(date -u +%F)"
          git push
      # GITHUB_TOKEN 的推送不会触发其他 workflow，这里直接调用 Pages 部署
      - name: Deploy Pages
        if: success()
        run: |
          if git log -1 --format=%s | grep -q '^chore(blocklist)'; then
            node scripts/build-pages.js
            npx -y wrangler@3 pages deploy public --project-name world-tree --branch main --commit-dirty=true
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
