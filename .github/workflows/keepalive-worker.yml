name: Deploy keepalive Worker
on:
  push:
    branches: [main]
    paths: ['workers/keepalive/**', '.github/workflows/keepalive-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: wrangler deploy (Cron Trigger */5)
        working-directory: workers/keepalive
        # 部署失败（如令牌缺 Account › Workers Scripts:Edit 权限）直接标红，不再假绿。
        run: npx -y wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: verify script + cron schedule exist on Cloudflare
        run: |
          set -euo pipefail
          A="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/guangqi-keepalive/schedules"
          R=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$A")
          echo "$R" | jq -c '{success, schedules: [.result.schedules[]?.cron]}'
          echo "$R" | jq -e '.success == true and ([.result.schedules[]?.cron] | index("*/5 * * * *")) != null' > /dev/null \
            || { echo "::error::Worker guangqi-keepalive 未部署或 Cron Trigger 不是 */5 * * * *"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
